name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create CI environment files
        run: |
          cp .env.example .env.development
          cp .env.example .env.staging
          cp .env.example .env.production

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Automation policy check
        run: python3 scripts/automation.py policy-check

  cms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cms
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  cms-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cms
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: cms/package-lock.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Install CMS dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start local Supabase
        working-directory: .
        run: supabase start

      - name: Reset local database with migrations and seed
        working-directory: .
        run: supabase db reset --yes

      - name: Local backup/restore rehearsal
        working-directory: .
        timeout-minutes: 15
        run: bash scripts/cms-backup-rehearsal.sh

      - name: Prepare CMS E2E public env
        run: |
          npm run test:e2e:env
          cp .env.e2e.local .env.local

      - name: Build CMS for E2E
        run: npm run build

      - name: Start CMS for smoke check
        run: |
          node scripts/e2e-start.mjs &
          echo $! > /tmp/cms-e2e-server.pid

      - name: Wait for CMS liveness
        run: |
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:3000/api/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "CMS did not become live in time" >&2
          exit 1

      - name: CMS deployment smoke check
        run: node scripts/smoke-check.mjs --base-url http://127.0.0.1:3000 --allow-localhost

      - name: Run CMS Playwright production-readiness suite
        run: npx playwright test
        env:
          CI: true
          CMS_E2E_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_REUSE_SERVER: "1"

      - name: Stop CMS server
        if: always()
        run: |
          if [ -f /tmp/cms-e2e-server.pid ]; then
            kill "$(cat /tmp/cms-e2e-server.pid)" 2>/dev/null || true
          fi
          pkill -f "next start --hostname 127.0.0.1 --port 3000" 2>/dev/null || true

      - name: Stop local Supabase
        if: always()
        working-directory: .
        run: supabase stop --no-backup
