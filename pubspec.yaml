name: base_project
description: Production-ready Flutter architecture starter with feature-first MVVM.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  go_router: ^14.8.1
  json_annotation: ^4.9.0
  logger: ^2.5.0
  meta: ^1.16.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.16.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.development
    - .env.staging
    - .env.production
